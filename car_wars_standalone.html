      const u = rpm / gb.redline;
      if (u > 0.985 && gi < gb.n - 1) { car.gearIdx = gi + 1; car.shiftT = 0.075; car.shiftFx = 1; }
      else if (u < 0.44 && gi > 0) { car.gearIdx = gi - 1; car.shiftT = 0.062; }
      gi = clamp(car.gearIdx | 0, 0, gb.n - 1);
      gearTop = gb.topMs / gb.ratios[gi];
      rpm = clamp(Math.abs(vf) / Math.max(2, gearTop) * gb.redline, gb.idle, gb.redline * 1.10);
    }
    car.gearN = gi + 1; car.engineRPM = rpm;
    const tq = torqueK(s, clamp(rpm / gb.redline, 0, 1.1));
    /* --- fuerzas longitudinales --- */
    let Fi = 0;
    const boostK = 1 + car.boost * (0.30 + 0.10 * (s.boost || 1));
    if (thr > 0) {
      /* el corte de encendido es POR MARCHA: en 1ª se acaba el empuje pronto y
         hay que cambiar (eso es lo que hace que 4, 5, 6 y 7 marchas se noten) */
      const f = 1 - Math.pow(clamp(Math.abs(vf) / Math.max(2, gearTop), 0, 1), 2) * 0.45;
      Fi += s.power * 12400 * thr * Math.pow(clamp(f, 0, 1), 0.7) * boostK * tq * (1 - clamp(car.shiftT * 6.0, 0, 0.52));
    } else if (thr < 0) {

      Fi -= Math.sign(vf) * Math.min(Math.abs(vf) * mass * 2.4 + 400, bf);
    } else if (Math.abs(thr) < 0.02) {

    }

       en un arcade el truco es mano + gas para sostener el derrape) */

    /* arrastre */
    const cdA = def.style === 'proto' ? 0.42 : (def.style === 'suv' ? 1.05 : 0.62);
    Fi -= 0.5 * 1.2 * cdA * 2.1 * vf * Math.abs(vf) * 0.42;
    Fi -= 26 * vf;
    /* fuera de pista: más resistencia */
    Fi -= (1 - onRoad) * (900 + 120 * Math.abs(vf)) * Math.sign(vf);
    /* --- fuerzas laterales (los neumáticos intentan anular vr) --- */
    /* fricción lateral de las ruedas traseras: muy alta en conducciín normal
       (anula el deslizamiento en ~0.05 s) y se suelta sólo con la tecla */
    const release = clamp(0.58 + 0.24 * (s.drift || 1), 0.48, 0.92);
    /* y el eje trasero aguanta menos cuanto más par le metes (si es motriz):
       por eso el Hammer se cruza solo al acelerar y el Grizzly no */
    const rearGrip = clamp(1 - Math.max(bal, 0) * Math.max(thr, 0) * 0.40 * (s.drive === 'fwd' ? 0.35 : 1)
      + (s.drive === 'awd' ? 0.10 * Math.max(thr, 0) : 0), 0.55, 1.18);
    const gripLat = lerp(27, 18, speedK) * (1 - release * Math.max(driftIn, holdK)) * rearGrip;
    let latAcc = -vr * gripLat * (mu / 1.25);
    /* tope de fuerza lateral: muy alto en conducciín normal (la rueda trasera
       AGUANTA el régimen y no desliza) y más bajo al derrapar */
    const latCap = latMax * (breaking || holdK > 0 ? 1.18 : 2.75);
    latAcc = clamp(latAcc, -latCap, latCap);
    /* con el derrape mantenido y gas, el trompo no frena el coche: las ruedas
       deslizando "empujan" hacia delante (arcade, evita derrapes a 30 km/h) */
    if (breaking && vf > 5 && thr > 0.15) Fi += Math.min(s.power * 9600, Math.abs(latAcc) * mass * 0.40);
    /* --- tracción disponible: el círculo de fricción y el eje motriz --- *
     * si el motor pide más fuerza de la que el neumático puede meter en el
     * suelo, patina: se pierde empuje, sale humo y el coche cambia de
     * carácter (el V8 trasero no es lo mismo que el 4x4 de 2150 kg). */
    {
      const loadLat = clamp(Math.abs(latAcc) / (latMax * 1.02), 0, 1);
      let share = s.drive === 'awd' ? 0.92 : (s.drive === 'fwd' ? 0.56 - 0.08 * Math.max(thr, 0) : 0.46 + 0.12 * Math.max(thr, 0));
      /* en un derrape sostenido el par es lo que mantiene el ángulo: ahí el eje
         motriz manda aunque el neumático esté cruzado (si no, nadie derrapa) */
      if (breaking) share = Math.max(share, 0.72 + 0.06 * (s.drift || 1));
      share *= 1 + s.downforce * clamp(Math.abs(vf) / 62, 0, 1.5) * 0.20;
      /* el patinaje come agarre, pero en un arcade el freno de mano suelta el
         eje trasero sin matar el empuje (mano + gas = derrape sostenido) */
      const maxDrive = Math.max(900, mu * G98 * mass * share * (1 - 0.40 * loadLat * (breaking ? 0.45 : 1)));
      if (Fi > maxDrive) {
        const over = (Fi - maxDrive) / maxDrive;
        Fi = maxDrive * (1 - clamp(over * 0.26, 0, 0.34));
        /* por encima de un 6 % de exceso empieza a cantear; hace falta un buen
           excedente (salida en 1ª con un V8) para que patine DE VERDAD */
        car.wheelspin = G.damp(car.wheelspin || 0, clamp((over - 0.03) * 2.2, 0, 1), 15, dt);
      } else {
        car.wheelspin = G.damp(car.wheelspin || 0, 0, 7, dt);
      }
    }
    /* --- integración en marco rotatorio --- */
    const acc = Fi / mass;
    let nvf = vf + (acc + vr * car.yawRate) * dt;
    let nvr = vr + (latAcc - vf * car.yawRate) * dt;
    /* techo de velocidad: corte de encendido (más margen con nitro) */
    nvf = clamp(nvf, -top * 0.32, top * (car.boost > 0.05 ? 1.12 : 1.008));
    car.vel[0] = fwd[0] * nvf + right[0] * nvr;
    car.vel[2] = fwd[2] * nvf + right[2] * nvr;
    car.vf = nvf; car.vr = nvr;
    /* aceleraciones para la cámara (inclinación / retroceso / FOV) */
    car.aLong = G.damp(car.aLong || 0, (nvf - vf) / Math.max(1e-4, dt), 12, dt);
    car.aLat = G.damp(car.aLat || 0, latAcc, 12, dt);
    car.speed = Math.hypot(car.vel[0], car.vel[2]);
    car.slip = Math.abs(nvr) / Math.max(3, car.speed);
    car.slipAngle = Math.atan2(Math.abs(nvr), Math.max(2.5, Math.abs(nvf)));
    /* derrape "de verdad": más velocidad y más ángulo que antes (17° -> ~19°) y con input */
    car.drifting = car.speed > 9 && Math.abs(nvr) > 3.2 && car.slipAngle > 0.24 &&
      (driftIn > 0.25 || holdK > 0 || (autoBreak && car.slipAngle > 0.45));
    /* --- posición (con barrido CCD contra los límites) --- */
    const p0x = car.pos[0], p0z = car.pos[2];
    car.pos[0] += car.vel[0] * dt;
    car.pos[2] += car.vel[2] * dt;
    car.yaw += car.yawRate * dt;
    if (car.yaw > Math.PI) car.yaw -= Math.PI * 2; else if (car.yaw < -Math.PI) car.yaw += Math.PI * 2;
    /* --- altura del terreno + orientación sobre la superficie --- */
    let gy = world.height.at(car.pos[0], car.pos[2]);
    /* El relieve fuera del asfalto sube (taludes, dunas): si el coche lo sigue,
       la valla se convierte en rampa y vuelca. Se limita cuánto puede subir o
       bajar el suelo respecto a la cota de la pista en su propio segmento. */
    if (world.track) {
      const t = world.track, iA = car.segIdx | 0;
      const roadY = t.Y[iA] || 0;
      const dOff = Math.max(0, (car.limitD_lat || 0) - halfW);
      const allowUp = 0.30 + dOff * 0.55;
      if (gy > roadY + allowUp) gy = roadY + allowUp;
      else if (gy < roadY - 2.4) gy = roadY - 2.4;
    }
    /* el techo de una roca/edificio también es suelo (nunca quedar dentro) */
    if (world.solidTopAt) {
      const st = world.solidTopAt(car.pos[0], car.pos[2]);
      if (st > gy) gy = st;
    }
    const nrm = world.height.normal(car.pos[0], car.pos[2], [0, 0, 0]);
    car.surfaceY = gy;
    const targetY = gy + 0.02;
    if (car.pos[1] < targetY) {
      const pen = targetY - car.pos[1];
      car.pos[1] = lerp(car.pos[1], targetY, clamp(dt * 26, 0, 1));
      if (car.vel[1] < 0) car.vel[1] *= -0.22;
      car.air = 0;
      if (pen > 0.35) { car.bounce = clamp(pen * 1.6, 0, 1); }
    } else {
      car.pos[1] += car.vel[1] * dt;
      car.vel[1] -= 24 * dt;
      car.air = Math.min(1.6, car.air + dt);
      if (car.pos[1] > targetY + 0.001) { }
      else { car.air = 0; }
    }
    /* suelo duro: el coche no se hunde en el terreno (evita "ver el vacío") */
    if (car.pos[1] < targetY) { car.pos[1] = targetY; if (car.vel[1] < 0) car.vel[1] = 0; }
    if (car.air <= 0.01 && car.vel[1] < 0) car.vel[1] = 0;
    /* alabeo/cabeceo siguiendo la normal de la superficie + transferencia */
    const fwdSlope = (world.height.at(car.pos[0] + fwd[0] * 2.2, car.pos[2] + fwd[2] * 2.2) - world.height.at(car.pos[0] - fwd[0] * 2.2, car.pos[2] - fwd[2] * 2.2)) / 4.4;
    const rightSlope = (world.height.at(car.pos[0] + right[0] * 1.7, car.pos[2] + right[2] * 1.7) - world.height.at(car.pos[0] - right[0] * 1.7, car.pos[2] - right[2] * 1.7)) / 3.4;
    const accLat = -latAcc;
    const rideK = clamp(s.ride || 1, 0.25, 1.3);
    const transfer = clamp(-accLat * 0.011 * (0.45 + 0.75 * rideK), -0.14, 0.14);
    const transferL = clamp(-acc * 0.006, -0.07, 0.07);
    car.pitch = G.damp(car.pitch, Math.atan(fwdSlope) * 0.85 + transferL * (0.5 + 0.7 * rideK), 9, dt);
    car.roll = G.damp(car.roll, Math.atan(rightSlope) * 0.85 + transfer * rideK, 11 - 3 * rideK, dt);
    car.bounce = G.damp(car.bounce, 0, 8, dt);
    /* --- límites de pista (quitamiedos / muros), con CCD --- *
     * 1) se mide la lateral LOCAL (ventana de índices) en el punto de
     *    partida y en el de llegada del paso;
     * 2) si el segmento barrido cruza la banda, se resuelve en el punto
     *    de contacto (t por interpolación) -> no se atraviesa a ninguna
     *    velocidad ni con pasos largos;
     * 3) se refleja la componente saliente y se aplica daño/rebote.
     */
    const limitD = wallLimit(world, opts, (def.W || 1.9) * 0.47);
    const L0 = limitAt(world, p0x, p0z, car.segIdx, L0BUF);
    const L1 = limitAt(world, car.pos[0], car.pos[2], L0.i, L1BUF);
    car.segIdx = L1.i;
    car.limitD = limitD; car.limitD_lat = L1.d;
    if (L1.d > limitD) {
      let px = car.pos[0], pz = car.pos[2], nx = L1.nx, nz = L1.nz, cx = L1.cx, cz = L1.cz;
      if (L0.d > limitD) {
        /* ya estaba fuera: simplemente pegar al borde */
      } else if (L1.d > L0.d) {
        /* cruce durante el paso -> retroceder al instante de contacto */
        const u = clamp((limitD - L0.d) / (L1.d - L0.d), 0, 1);
        const s2 = limitAt(world, lerp(p0x, car.pos[0], u), lerp(p0z, car.pos[2], u), L0.i, L2BUF);
        cx = s2.cx; cz = s2.cz; nx = s2.nx; nz = s2.nz;
        px = lerp(p0x, car.pos[0], u); pz = lerp(p0z, car.pos[2], u);
      }
      /* recolocar en la cara interior del muro (banda gruesa, sin jitter) */
      const setD = limitD - 0.02;
      car.pos[0] = cx + nx * setD; car.pos[2] = cz + nz * setD;
      /* velocidad saliente a lo largo de la normal del muro */
      const vOut = car.vel[0] * nx + car.vel[2] * nz;
      if (vOut > 0) {
        const rest = 0.34;
        car.vel[0] -= nx * vOut * (1 + rest);
        car.vel[2] -= nz * vOut * (1 + rest);
        /* el roce con el muro frena y quita giro */
        car.vel[0] *= 0.93; car.vel[2] *= 0.93;
        car.yawRate *= 0.42;
        car.hitDir[0] = -nx; car.hitDir[1] = -nz;
        if (vOut > 2.5) {
          car.damage = clamp(car.damage + vOut * 0.017 * (def.stats.fragility || 1), 0, 1);
          car.hitTimer = 0.35;
          if (world.onHit) world.onHit(car, vOut, car.pos[0], car.pos[1], car.pos[2]);
        }
        car.vf = car.vel[0] * fwd[0] + car.vel[2] * fwd[2];
        car.vr = car.vel[0] * right[0] + car.vel[2] * right[2];
      }
    }
    /* --- sólidos del escenario (rocas, mesas, naves, torres, muros) --- *
     * el radio viene del bounding box del mesh visual: el collider COINCIDE
     * con lo que se ve. El barrido del segmento evita atravesarlos a 240 km/h. */
    if (world.solids && world.solids.length) {
      const near = world.solidsNear(car.pos[0], car.pos[2]);
      const carR = (def.W || 1.9) * 0.47;
      for (let si = 0; si < near.length; si++) {
        const so = near[si];
        if (car.pos[1] > so.y + so.h + 0.2) continue;
        const rr = so.r + carR;
        let sx = car.pos[0], sz = car.pos[2];
        const ex = car.pos[0] - p0x, ez = car.pos[2] - p0z;
        const L2 = ex * ex + ez * ez;
        if (L2 > 1e-6) {
          let u = ((so.x - p0x) * ex + (so.z - p0z) * ez) / L2;
          u = u < 0 ? 0 : (u > 1 ? 1 : u);
          sx = p0x + ex * u; sz = p0z + ez * u;
        }
        let dx = sx - so.x, dz = sz - so.z;
        let dd = Math.hypot(dx, dz);
        if (dd >= rr) continue;
        if (dd < 1e-4) { dx = 1; dz = 0; dd = 1; }
        const nx = dx / dd, nz = dz / dd;
        car.pos[0] += nx * (rr - dd); car.pos[2] += nz * (rr - dd);
        const vOut = car.vel[0] * nx + car.vel[2] * nz;
        if (vOut < 0) {
          car.vel[0] -= nx * vOut * 1.24; car.vel[2] -= nz * vOut * 1.24;
          car.vel[0] *= 0.82; car.vel[2] *= 0.82;
          car.yawRate *= 0.36;
          car.hitDir[0] = -nx; car.hitDir[1] = -nz;
          if (-vOut > 2.2) {
            car.damage = clamp(car.damage + (-vOut) * 0.020 * (def.stats.fragility || 1), 0, 1);
            car.hitTimer = 0.34;
            if (world.onHit) world.onHit(car, -vOut, car.pos[0], car.pos[1], car.pos[2]);
          }
        }
      }
    }
    /* caja absoluta: imposible salir del mundo (y por tanto del mapa visible) */
    {
      const B = (world.spec.world || 400) - 4;
      if (car.pos[0] > B) { car.pos[0] = B; if (car.vel[0] > 0) car.vel[0] = -car.vel[0] * 0.2; }
      else if (car.pos[0] < -B) { car.pos[0] = -B; if (car.vel[0] < 0) car.vel[0] = -car.vel[0] * 0.2; }
      if (car.pos[2] > B) { car.pos[2] = B; if (car.vel[2] > 0) car.vel[2] = -car.vel[2] * 0.2; }
      else if (car.pos[2] < -B) { car.pos[2] = -B; if (car.vel[2] < 0) car.vel[2] = -car.vel[2] * 0.2; }
    }
    car.hitTimer = Math.max(0, car.hitTimer - dt);
    /* --- ruedas / rpm --- */
    car.wheelSpin += (nvf / Math.max(0.2, def.wheelR)) * dt;
    car.steerVis = G.damp(car.steerVis, car.steer * steerMax, 13, dt);
    /* (rpm ya viene de la caja de cambios arriba; aquí sólo el ralentí) */
    if (car.throttle === 0 && car.speed < 1) car.engineRPM = gb.idle + Math.sin((car.speed + rpm) * 0.012) * 40;
    if (car.throttle === 0 && car.speed < 1) car.engineRPM = 820 + Math.sin(performance.now() * 0.012) * 40;
    /* combustible de nitro */
    if (car.boost > 0.05) car.boostFuel = Math.max(0, car.boostFuel - dt * 26);
    else car.boostFuel = Math.min(100, car.boostFuel + dt * (car.speed > 3 ? 5.2 : 2.4));
    return car;
  }

  /* ---------------- colisión entre coches ---------------- */
  function carCollisions(cars, onHit) {
    for (let i = 0; i < cars.length; i++) {
      const a = cars[i];
      for (let j = i + 1; j < cars.length; j++) {
        const b = cars[j];
        const dx = b.pos[0] - a.pos[0], dz = b.pos[2] - a.pos[2];
        const d2 = dx * dx + dz * dz;
        const rr = 1.34 + 1.34;
        if (d2 > rr * rr || d2 < 1e-6) continue;
        const d = Math.sqrt(d2);
        const nx = dx / d, nz = dz / d;
        const ma = a.stats.mass, mb = b.stats.mass;
        const ia = 1 / ma, ib = 1 / mb, iSum = ia + ib;
        /* separación ponderada por masa: el pesado no sale disparado igual que el ligero */
        const pen = rr - d;
        a.pos[0] -= nx * pen * (ia / iSum) * 0.92; a.pos[2] -= nz * pen * (ia / iSum) * 0.92;
        b.pos[0] += nx * pen * (ib / iSum) * 0.92; b.pos[2] += nz * pen * (ib / iSum) * 0.92;
        const rvx = b.vel[0] - a.vel[0], rvz = b.vel[2] - a.vel[2];
        const vn = rvx * nx + rvz * nz;
        const tvx = rvx - nx * vn, tvz = rvz - nz * vn;
        const tl = Math.hypot(tvx, tvz);
        if (vn < 0) {
          /* e = 0.22: rebote corto. ANTES era 1.28, o sea CADA choque añadía
             energía -> los dos coches salían despedidos y girando sin parar */
          const e = 0.22;
          const imp = -(1 + e) * vn / iSum;
          a.vel[0] -= nx * imp * ia; a.vel[2] -= nz * imp * ia;
          b.vel[0] += nx * imp * ib; b.vel[2] += nz * imp * ib;
          /* roce entre carrocerías (Coulomb, con tope): no puede invertir el
             deslizamiento relativo, así que no añade energía como añadía antes */
          if (tl > 1e-4) {
            const fr = 0.45;
            const jt = clamp((tl / iSum) * fr * 2, -fr * Math.abs(imp), fr * Math.abs(imp));
            const tx = tvx / tl, tz = tvz / tl;
            a.vel[0] += tx * jt * ia; a.vel[2] += tz * jt * ia;
            b.vel[0] -= tx * jt * ib; b.vel[2] -= tz * jt * ib;
          }
          /* par de giro: brazo × impulso / inercia (yac), acotado y amortiguado */
          const armA = (nx * Math.cos(a.yaw) - nz * Math.sin(a.yaw)) * 1.15;
          const armB = (nx * Math.cos(b.yaw) - nz * Math.sin(b.yaw)) * 1.15;
          a.yawRate = clamp(a.yawRate - armA * imp / (ma * 3.1), -1.9, 1.9) * 0.88;
          b.yawRate = clamp(b.yawRate + armB * imp / (mb * 3.1), -1.9, 1.9) * 0.88;
          /* el centro de gravedad bajo: un choque no lanza el coche hacia arriba */
          const lift = Math.min(0.35, Math.abs(vn) * 0.012);
          a.vel[1] = Math.max(a.vel[1], -lift); b.vel[1] = Math.max(b.vel[1], -lift);
          const spd = -vn;
          if (spd > 1.6) {
            a.damage = clamp(a.damage + spd * 0.010, 0, 1);
            b.damage = clamp(b.damage + spd * 0.010, 0, 1);
            a.hitTimer = b.hitTimer = 0.3;
            a.hitDir[0] = -nx; a.hitDir[1] = -nz;
            b.hitDir[0] = nx; b.hitDir[1] = nz;
            if (onHit) onHit(a, spd, (a.pos[0] + b.pos[0]) / 2, (a.pos[1] + b.pos[1]) / 2, (a.pos[2] + b.pos[2]) / 2, b);
          }
        } else if (tl > 0.5) {
          /* yendo pegados de lado: fricción de chasis limitada por el propio tl,
             repartida por masas (antes se aplicaba igual a ambos -> el ligero
             se disparaba) */
          const tx = tvx / tl, tz = tvz / tl;
          const jt = Math.min(tl / iSum, (tl / iSum) * 0.55);
          a.vel[0] += tx * jt * ia; a.vel[2] += tz * jt * ia;
          b.vel[0] -= tx * jt * ib; b.vel[2] -= tz * jt * ib;
          a.yawRate *= 0.94; b.yawRate *= 0.94;
        }
      }
    }
  }

  /* ================================================================== *
   *  IA: sigue la línea de carrera con lookahead y límite por curvatura
   * ================================================================== */
  function aiDrive(car, world, dt, targetSpeedK, avoidList) {
    const t = world.track, n = t.n;
    const mask = world.mask;
    const ai = car.ai;
    ai.think -= dt;
    if (ai.think <= 0) {
      ai.think = 0.1 + Math.random() * 0.1;
      /* índice de camino por delante según velocidad */
      const myIdx = Math.round(mask.seg(car.pos[0], car.pos[2]));
      const look = clamp(Math.round(6 + car.speed * 0.55), 5, 34);
      ai.line = clamp(ai.line + (Math.random() - 0.5) * 0.35, -0.62, 0.62);
      ai.target = ((myIdx + look) % n + n) % n;
      ai.myIdx = myIdx;
    }
    const i = ai.target;
    /* objetivo = centro + desplazamiento hacia el interior de la curva */
    const halfW = t.spec.w * 0.62;
    const r = t.radius[i % n];
    const curb = clamp((30 - Math.min(r, 30)) / 24, 0, 1) * halfW * 0.85;
    /* hacia el interior de la curva: usamos el cambio de tangente */
    const t0 = [t.T[i * 2], t.T[i * 2 + 1]];
    const t1 = [t.T[((i + 6) % n) * 2], t.T[((i + 6) % n) * 2 + 1]];
    const cross = t0[0] * t1[1] - t0[1] * t1[0];
    const inward = Math.sign(cross) || 1;
    const off = inward * (curb + ai.line * halfW * 0.4);
    const tx = t.centers[i][0] + t.N[i * 2] * off;
    const tz = t.centers[i][1] + t.N[i * 2 + 1] * off;
    /* steering hacia el objetivo */
    const dx = tx - car.pos[0], dz = tz - car.pos[2];
    const desired = Math.atan2(dx, dz);
    let err = G.wrapPi(desired - car.yaw);
    /* esquivar al de delante */
    if (avoidList) {
      for (const o of avoidList) {
        if (o === car) continue;
        const ox = o.pos[0] - car.pos[0], oz = o.pos[2] - car.pos[2];
        const front = ox * Math.sin(car.yaw) + oz * Math.cos(car.yaw);
        const lat = ox * Math.cos(car.yaw) - oz * Math.sin(car.yaw);
        if (front > 1 && front < 13 && Math.abs(lat) < 3.4) {
          err += -Math.sign(lat || 1) * clamp((3.4 - Math.abs(lat)) / 3.4, 0, 1) * 0.42 * (1 - front / 13);
        }
      }
    }
    /* velocidad objetivo: límite por radio + pendiente */
    const rmin = Math.max(14, Math.min(r, 260));
    const cst = car.stats;
    /* cada IA conduce CON su coche: el 4x4 no le teme a la tierra, el nervioso
       de tracción trasera levanta el pie a media curva, el ágil traza más tarde */
    const mu = 1.16 * cst.grip * (car.onRoad > 0.5 ? 1 : 0.45 + 0.30 * clamp(cst.offRoad || 0.75, 0.5, 1.05));
    let vMax = Math.sqrt(Math.max(6, rmin * G98 * mu * (targetSpeedK || 0.94)));
    vMax = Math.min(vMax, cst.top / 3.6 * (targetSpeedK || 0.94));
    if (Math.abs(err) > 1.0) vMax *= 0.5;
    if (car.speed > vMax * 1.06) { car.throttle = 0; car.brake = clamp((car.speed - vMax) * (0.22 / clamp(cst.brake || 1, 0.75, 1.15)), 0, 1); car.handbrake = car.speed > vMax * 1.5 && Math.abs(err) > 0.8 && (cst.drift || 1) > 1.05 ? 0.8 : 0; }
    else { car.throttle = clamp((vMax - car.speed) * 0.5 + 0.35, 0, 1); car.brake = 0; car.handbrake = 0; }
    /* el que se suelta detrás (balance > 0.2) cuida el gas en apoyo: si no,
       los rivales irían de lado por todas partes y no se entendería nada */
    if ((cst.balance || 0) > 0.2 && Math.abs(err) > 0.30 && car.speed > vMax * 0.92) car.throttle = Math.min(car.throttle, 0.58);
    car.steer = clamp(err * 2.35 * (0.88 + 0.14 * clamp(cst.agility || 1, 0.7, 1.3)) - car.yawRate * 0.30, -1, 1);
    /* salida de derrape */
    if (Math.abs(car.vr) > 7.5) { car.throttle *= 0.45; car.brake = Math.max(car.brake, 0.15); }
    car.boost = (vMax > car.speed * 1.4 && car.boostFuel > 40 && (targetSpeedK || 1) > 0.95) ? 0.8 : 0;
  }

  /* ================================================================== *
   *  Partículas / efectos
   * ================================================================== */
  function FX(o) {
    o = o || {};
    this.max = o.max || 900;
    this.list = [];
    for (let i = 0; i < this.max; i++) this.list.push(newParticle());
    this.head = 0;
    this.rings = [];
  }
  function newParticle() {
    return { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, life: 0, max: 1, s0: 1, s1: 2, r: 1, g: 1, b: 1, a: 1, kind: 0, roll: 0, rotV: 0, grav: -3, drag: 1.6, active: false };
  }
  FX.prototype.spawn = function (x, y, z, vx, vy, vz, life, s0, s1, col, alpha, kind, grav, drag) {
    let p = null;
    for (let k = 0; k < this.max; k++) {
      const c = this.list[(this.head + k) % this.max];
      if (!c.active) { p = c; this.head = (this.head + k + 1) % this.max; break; }
    }
    if (!p) { p = this.list[this.head]; this.head = (this.head + 1) % this.max; }
    p.x = x; p.y = y; p.z = z; p.vx = vx; p.vy = vy; p.vz = vz;
    p.life = p.max = life; p.s0 = s0; p.s1 = s1;
    p.r = col[0]; p.g = col[1]; p.b = col[2]; p.a = alpha == null ? 1 : alpha;
    p.kind = kind || 0; p.grav = grav == null ? -3 : grav; p.drag = drag == null ? 1.6 : drag;
    p.roll = Math.random() * 6.28; p.rotV = (Math.random() - 0.5) * 3.4;
    p.active = true;
    return p;
  };
  /* cambiar la calidad no debe dejar el pool más corto que this.max */
  FX.prototype.setCap = function (n) {
    n = Math.max(64, n | 0);
    this.max = n;
    const list = this.list;
    while (list.length < n) list.push(newParticle());
    if (list.length > n) {
      for (let i = n; i < list.length; i++) list[i].active = false;
      list.length = n;
    }
    this.head = this.head % n;
    return this;
  };
  FX.prototype.update = function (dt, world) {
    const n2 = Math.min(this.max, this.list.length);
    for (let i = 0; i < n2; i++) {
      const p = this.list[i];
      if (!p.active) continue;
      p.life -= dt;
      if (p.life <= 0) { p.active = false; continue; }
      p.vy += p.grav * dt;
      const d = Math.exp(-p.drag * dt);
      p.vx *= d; p.vz *= d; p.vy *= (p.kind === 1 ? 1.0 : d);
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      p.roll += p.rotV * dt;
      if (p.ground && world) {
        const gy = world.height.at(p.x, p.z) + 0.03;
        if (p.y < gy) { p.y = gy; p.vy = Math.abs(p.vy) * 0.24; p.vx *= 0.72; p.vz *= 0.72; }
      }
    }
  };
  FX.prototype.emitToRenderer = function (R) {
    const n2 = Math.min(this.max, this.list.length);
    for (let i = 0; i < n2; i++) {
      const p = this.list[i];
      if (!p.active) continue;
      const t = 1 - p.life / p.max;
      const size = lerp(p.s0, p.s1, t);
      let a = p.a * (t < 0.14 ? t / 0.14 : (1 - Math.pow((t - 0.14) / 0.86, 1.6)));
      if (a <= 0.004) continue;
      R.pushParticle(p.x, p.y, p.z, size, p.r, p.g, p.b, clamp(a, 0, 1), p.roll, p.kind);
    }
  };
  FX.prototype.clear = function () { for (const p of this.list) p.active = false; };

  /* ---------- emisores ---------- */
  function tireSmoke(fx, car, world, intensity, axle) {
    const c = Math.cos(car.yaw), s = Math.sin(car.yaw);
    const def = car.def;
    const lz = axle === 'f' ? def.wb / 2 : -def.wb / 2;   /* humo en el eje que patina */
    for (const side of [-1, 1]) {
      const lx = side * def.track / 2;
      const wx = car.pos[0] + lx * c + lz * s, wz = car.pos[2] - lx * s + lz * c;
      const gy = world.height.at(wx, wz) + 0.1;
      const n = intensity > 0.6 ? 2 : 1;
      for (let k = 0; k < n; k++) {
        const grey = car.onRoad > 0.6 ? 0.86 : 0.62;
        const col = car.onRoad > 0.6 ? [grey, grey, grey * 0.98] : [0.66, 0.58, 0.46];
        fx.spawn(
          wx + (Math.random() - 0.5) * 0.3, gy + Math.random() * 0.16, wz + (Math.random() - 0.5) * 0.3,
          -car.vel[0] * 0.12 + (Math.random() - 0.5) * 2.2,
          1.3 + Math.random() * 2.2 * intensity,
          -car.vel[2] * 0.12 + (Math.random() - 0.5) * 2.2,
          0.7 + Math.random() * 0.9, 0.5 + Math.random() * 0.5, 3.2 + Math.random() * 2.6,
          col, 0.30 + 0.4 * intensity, 0, 0.55, 1.25);
      }
    }
  }
  function sparks(fx, x, y, z, nx, nz, power) {
    const n = clamp(Math.round(power * 2.4), 3, 16);
    for (let i = 0; i < n; i++) {
      fx.spawn(x, y + 0.4 + Math.random() * 0.5, z,
        nx * (2 + Math.random() * 7) + (Math.random() - 0.5) * 4, 2 + Math.random() * 6,
        nz * (2 + Math.random() * 7) + (Math.random() - 0.5) * 4,
        0.28 + Math.random() * 0.42, 0.16, 0.02,
        [1, 0.72 + Math.random() * 0.28, 0.24], 1, 2, -16, 0.8);
    }
  }
  function debris(fx, x, y, z, power, col) {
    for (let i = 0; i < clamp(Math.round(power), 2, 10); i++) {
      const p = fx.spawn(x, y + 0.5, z, (Math.random() - 0.5) * 8, 2 + Math.random() * 5, (Math.random() - 0.5) * 8,
        0.6 + Math.random() * 0.7, 0.22, 0.05, col || [0.5, 0.5, 0.52], 1, 0, -19, 0.6);
      p.ground = true;
    }
  }
  function nitroFlame(fx, car, world) {
    const c = Math.cos(car.yaw), s = Math.sin(car.yaw);
    for (const side of [-1, 1]) {
      const lx = side * 0.42, lz = -car.def.L / 2 - 0.12;
      const wx = car.pos[0] + lx * c + lz * s, wz = car.pos[2] - lx * s + lz * c;
      fx.spawn(wx, car.pos[1] + 0.3, wz,
        -s * 0 + -c * 0 + (Math.random() - 0.5) * 1.2 - car.vel[0] * 0.2,
        0.4 + Math.random() * 0.8,
        (Math.random() - 0.5) * 1.2 - car.vel[2] * 0.2,
        0.14 + Math.random() * 0.12, 0.42, 0.05,
        [1, 0.55 + Math.random() * 0.4, 0.12], 1, 2, 0.5, 3.2);
    }
  }
  function dustTrail(fx, car, world) {
    if (car.onRoad > 0.75) return;
    if (Math.random() > 0.55) return;
    const c = Math.cos(car.yaw), s = Math.sin(car.yaw);
    const lx = (Math.random() - 0.5) * car.def.W, lz = (Math.random() - 0.5) * car.def.L * 0.4;
    const wx = car.pos[0] + lx * c + lz * s, wz = car.pos[2] - lx * s + lz * c;
    const gy = world.height.at(wx, wz);
    const dry = world.spec.ground.kind === 'sand';
    fx.spawn(wx, gy + 0.12, wz,
      (Math.random() - 0.5) * 1.8, 0.8 + Math.random() * 1.4, (Math.random() - 0.5) * 1.8,
      0.5 + Math.random() * 0.6, 0.4, 2.2,
      dry ? [0.72, 0.62, 0.46] : [0.55, 0.55, 0.5], 0.24, 0, 0.4, 1.8);
  }

  G.Car = Car;
  G.physics = physics;
  G.carCollisions = carCollisions;
  G.aiDrive = aiDrive;
  G.FX = FX;
  G.Effects = { tireSmoke, sparks, debris, nitroFlame, dustTrail };
})(window.CW);

</script>
<script>/* js/ui.js */
/* =====================================================================
   ui.js — entrada (teclado, ratón, táctil, mando), HUD 2D sobre canvas
   y pantallas de menú. Todo DOM/CSS inline-friendly, sin dependencias.
   ===================================================================== */
(function (G) {
  'use strict';
  const clamp = G.clamp, lerp = G.lerp;

  /* ================================================================== *
   *  INPUT
   * ================================================================== */
  const KEYS = {
    ArrowUp: 'throttle', KeyW: 'throttle',
    ArrowDown: 'brake', KeyS: 'brake',
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    Space: 'hand', ShiftLeft: 'hand', ShiftRight: 'hand', KeyE: 'boost',
    ControlLeft: 'boost', ControlRight: 'boost',
    KeyC: 'cam', KeyR: 'reset', KeyH: 'horn', KeyM: 'mute', KeyP: 'pause', Escape: 'pause',
    Tab: 'map', KeyL: 'lights', KeyV: 'look'
  };
  function Input(o) {
    o = o || {};
    this.k = {};
    this.pressed = {};
    this.stick = { steer: 0, thr: 0, brake: 0 };
    this.touch = { steer: 0, thr: 0, brake: 0, hand: false, boost: false, active: false };
    this.pad = -1;
    this.padSeen = false;
    this.mode = o.mode || 'keys';
    this.enabled = true;
    this.touches = new Map();
    if (typeof document !== 'undefined') this.bindDOM(o.root || document.body);
    if (typeof window !== 'undefined' && window.addEventListener) {
      window.addEventListener('gamepadconnected', (e) => { this.pad = e.gamepad.index; this.padSeen = true; });
      window.addEventListener('gamepaddisconnected', () => { this.pad = -1; });
    }
  }
  Input.prototype.bindDOM = function (root) {
    const kd = (e) => {
      const a = KEYS[e.code];
      if (a) {
        if (!this.k[a]) this.pressed[a] = true;
        this.k[a] = 1;
        if (e.code === 'Tab' || e.code === 'Space' || e.code.indexOf('Arrow') === 0) e.preventDefault();
      }
      if (this.onKey) this.onKey(e);
    };
    const ku = (e) => { const a = KEYS[e.code]; if (a) this.k[a] = 0; };
    document.addEventListener('keydown', kd);
    document.addEventListener('keyup', ku);
    window.addEventListener('blur', () => { this.k = {}; });
    this._kd = kd; this._ku = ku;
  };
  Input.prototype.pollPad = function () {
    const s = { steer: 0, thr: 0, brake: 0, hand: false, boost: false, cam: false, ok: false };
    if (typeof navigator === 'undefined' || !navigator.getGamepads) return s;
    let gp = null;
    const pads = navigator.getGamepads();
    if (this.pad >= 0 && pads[this.pad]) gp = pads[this.pad];
    else for (const p of pads) if (p) { gp = p; this.pad = p.index; break; }
    if (!gp) return s;
    s.ok = true;
    const ax = gp.axes && gp.axes.length ? gp.axes : [0, 0];
    let steer = (ax[0] || 0);
    if (Math.abs(steer) < 0.16) steer = 0;
    s.steer = clamp(steer, -1, 1);
    const tr = gp.buttons[7] ? gp.buttons[7].value : 0;
    const br = gp.buttons[6] ? gp.buttons[6].value : 0;
    s.thr = tr > 0.06 ? tr : 0;
    s.brake = br > 0.06 ? br : 0;
    if (s.thr === 0 && gp.buttons[3] && gp.buttons[3].pressed) s.thr = 1;   /* Y = gas alternative */
    if (s.brake === 0 && gp.buttons[2] && gp.buttons[2].pressed) s.brake = 1;
    s.hand = !!(gp.buttons[0] && gp.buttons[0].pressed) || !!(gp.buttons[1] && gp.buttons[1].pressed) ||
      !!(gp.buttons[5] && gp.buttons[5].pressed) || !!(gp.buttons[4] && gp.buttons[4].pressed);
    s.boost = !!(gp.buttons[2] && gp.buttons[2].pressed) || !!(gp.buttons[7] && gp.buttons[7].pressed && gp.buttons[6].value > 0.9) || !!(gp.buttons[10] && gp.buttons[10].pressed);
    s.cam = !!(gp.buttons[9] && gp.buttons[9].pressed);
    s.start = !!(gp.buttons[9] && gp.buttons[9].pressed);
    s.back = !!(gp.buttons[8] && gp.buttons[8].pressed);
    return s;
  };
  /* estado combinado -> accionables del coche */
  Input.prototype.state = function () {
    const k = this.k;
    let steer = (k.right ? 1 : 0) - (k.left ? 1 : 0);
    let thr = k.throttle ? 1 : 0, brk = k.brake ? 1 : 0;
    let hand = k.hand ? 1 : 0, boost = k.boost ? 1 : 0;
    if (this.touch.active) {
      steer = this.touch.steer || steer;
      thr = Math.max(thr, this.touch.thr);
      brk = Math.max(brk, this.touch.brake);
      hand = Math.max(hand, this.touch.hand ? 1 : 0);
      boost = Math.max(boost, this.touch.boost ? 1 : 0);
    }
    const p = this.pollPad();
    if (p.ok) {
      if (Math.abs(p.steer) > Math.abs(steer)) steer = p.steer;
      thr = Math.max(thr, p.thr); brk = Math.max(brk, p.brake);
      hand = Math.max(hand, p.hand ? 1 : 0);
      boost = Math.max(boost, p.boost ? 1 : 0);
      if (p.cam) this.pressed.cam = true;
      if (p.start) this.pressed.pause = true;
    }
    if (k.throttle && k.brake) brk = 0;
    return {
      steer: clamp(steer, -1, 1), throttle: thr, brake: brk, hand, boost,
      drift: hand,                /* el canal de derrape (SHIFT o ESPACIO) */
      pressed: this.pressed,
      clear: () => { this.pressed = {}; }
    };
  };

  /* ---------------- controles táctiles ---------------- */
  function TouchControls(root, input) {
    this.root = root; this.input = input;
    this.el = document.createElement('div');
    this.el.className = 'tc';
    this.el.innerHTML =
      '<div class="tc-side tc-left"><div class="tc-pad" data-a="left"><span>◀</span></div>' +
      '<div class="tc-pad" data-a="right"><span>▶</span></div></div>' +
      '<div class="tc-side tc-right"><div class="tc-pad big" data-a="gas"><span>GAS</span></div>' +
      '<div class="tc-row"><div class="tc-pad" data-a="freno"><span>FRENO</span></div>' +
      '<div class="tc-pad" data-a="derrape"><span>DERRAPE</span></div>' +
      '<div class="tc-pad" data-a="nitro"><span>NITRO</span></div></div></div>';
    root.appendChild(this.el);
    const self = this;
    const st = input.touch;
    function bind(el, act) {
      const on = (e) => {
        e.preventDefault();
        st.active = true;
        if (act === 'left') st.steer = -1; else if (act === 'right') st.steer = 1;
        else if (act === 'gas') st.thr = 1; else if (act === 'freno') st.brake = 1;
        else if (act === 'derrape') st.hand = true; else if (act === 'nitro') { st.boost = true; input.pressed.boostHold = true; }
        el.classList.add('on');
      };
      const off = (e) => {
        if (e) e.preventDefault();
        if (act === 'left' || act === 'right') st.steer = 0;
        else if (act === 'gas') st.thr = 0; else if (act === 'freno') st.brake = 0;
        else if (act === 'derrape') st.hand = false; else if (act === 'nitro') st.boost = false;
        el.classList.remove('on');
      };
      el.addEventListener('touchstart', on, { passive: false });
      el.addEventListener('touchend', off);
      el.addEventListener('touchcancel', off);
      el.addEventListener('mousedown', on);
      window.addEventListener('mouseup', off);
      el.addEventListener('contextmenu', e => e.preventDefault());
    }
    Array.prototype.forEach.call(this.el.querySelectorAll('[data-a]'), el => bind(el, el.getAttribute('data-a')));
    this.el.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  }
  TouchControls.prototype.setVisible = function (v) { this.el.style.display = v ? '' : 'none'; };

  /* ================================================================== *
   *  HUD: velocímetro, minimapa, tiempos, barra de derrape
   * ================================================================== */
  function HUD(o) {
    this.c = o.canvas;
    this.ctx = this.c.getContext('2d');
    this.mini = o.minimap;                 /* canvas aparte */
    this.mc = this.mini ? this.mini.getContext('2d') : null;
    this.dpr = Math.min(2, (typeof devicePixelRatio !== 'undefined' ? devicePixelRatio : 1));
    this.shake = 0; this.flash = 0; this.msg = ''; this.msgT = 0;
    this.gauge = 0;
    this.records = {};
    this.ripples = [];
  }
  HUD.prototype.resize = function (w, h) {
    this.w = w; this.h = h;
    this.c.width = Math.round(w * this.dpr); this.c.height = Math.round(h * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (this.mini) {
      const s = 168;
      this.mini.width = Math.round(s * this.dpr); this.mini.height = Math.round(s * this.dpr);
      this.mc.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      this.ms = s;
    }
  };
  HUD.prototype.toast = function (txt, t) { this.msg = txt; this.msgT = t || 2.0; };
  HUD.prototype.hit = function (p) { this.shake = Math.min(1.4, this.shake + p); this.flash = Math.min(1, this.flash + p * 0.6); };

  HUD.prototype.update = function (game, dt) {
    this.shake = Math.max(0, this.shake - dt * 2.4);
    this.flash = Math.max(0, this.flash - dt * 2.2);
    if (this.msgT > 0) this.msgT -= dt;
    const p = game.player;
    this.gauge = lerp(this.gauge, clamp(p.speed / 78, 0, 1), 1 - Math.exp(-8 * dt));
  };

  HUD.prototype.draw = function (game) {
    const x = this.ctx, w = this.w, h = this.h, p = game.player;
    x.clearRect(0, 0, w, h);
    if (this.flash > 0.01) {
      x.fillStyle = 'rgba(255,90,50,' + (this.flash * 0.22).toFixed(3) + ')';
      x.fillRect(0, 0, w, h);
    }
    /* ---- velocímetro ---- */
    const R = Math.min(96, w * 0.15), cx = w - R - 22, cy = h - R - 20;
    x.save();
    x.translate(cx, cy);
    x.fillStyle = 'rgba(8,10,16,0.55)';
    x.beginPath(); x.arc(0, 0, R + 8, 0, 6.2832); x.fill();
    x.lineWidth = 2; x.strokeStyle = 'rgba(150,190,255,0.25)'; x.stroke();
    const a0 = Math.PI * 0.78, a1 = Math.PI * 2.22;
    const kmh = p.speed * 3.6;
    const frac = clamp(kmh / (p.stats.top * 1.05), 0, 1);
    /* marcas */
    for (let i = 0; i <= 10; i++) {
      const a = lerp(a0, a1, i / 10);
      const r0 = R - (i % 2 ? 7 : 12), r1 = R - 1;
      x.beginPath();
      x.moveTo(Math.cos(a) * r0, Math.sin(a) * r0); x.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
      x.strokeStyle = i > 7 ? 'rgba(255,120,90,0.85)' : 'rgba(210,230,255,0.55)';
      x.lineWidth = i % 2 ? 1.4 : 2.6; x.stroke();
    }
    /* arco de velocidad */
    x.beginPath(); x.arc(0, 0, R - 18, a0, lerp(a0, a1, frac));
    x.strokeStyle = p.drifting ? '#ffcc44' : (game.boostFx > 0.2 ? '#57d8ff' : '#7fd6ff');
    x.lineWidth = 5; x.lineCap = 'round'; x.stroke();
    /* aguja */
    const aa = lerp(a0, a1, frac);
    x.beginPath(); x.moveTo(Math.cos(aa + Math.PI) * 9, Math.sin(aa + Math.PI) * 9);
    x.lineTo(Math.cos(aa) * (R - 22), Math.sin(aa) * (R - 22));
    x.strokeStyle = '#fff'; x.lineWidth = 2.2; x.stroke();
    /* cifras */
    x.textAlign = 'center';
    x.fillStyle = '#eaf2ff'; x.font = '600 ' + Math.round(R * 0.44) + 'px ui-monospace,Menlo,Consolas,monospace';
    x.fillText(Math.round(kmh), 0, R * 0.34);
    x.fillStyle = 'rgba(190,210,240,0.7)'; x.font = '600 11px system-ui,sans-serif';
    x.fillText('KM/H', 0, R * 0.52);
    x.fillStyle = 'rgba(190,210,240,0.85)'; x.font = '700 13px ui-monospace,monospace';
    x.fillText('M' + (p.gearN || 1) + '/' + (p.stats.gears || 5), 0, -R * 0.42);
    /* arco de vueltas con el corte de encendido de cada motor (no el mismo
       para todos: 5 000 rpm el 4x4, 11 000 el prototipo) */
    {
      const rl = p.stats.redline || 7000, ur = clamp((p.engineRPM || 800) / rl, 0, 1.05);
      x.beginPath(); x.arc(0, 0, R + 15, a0, lerp(a0, a1, clamp(ur, 0, 1)));
      x.strokeStyle = ur > 0.985 ? '#ff5a4a' : (ur > 0.86 ? '#ffb14a' : '#8fd0ff');
      x.lineWidth = 3.6; x.stroke();
      x.fillStyle = 'rgba(190,210,240,0.55)'; x.font = '600 10px ui-monospace,monospace';
      x.fillText(Math.round(p.engineRPM || 800) + ' rpm', 0, -R * 0.22);
      /* cuando patina (salida, derrape) se ve: el coche no es sólo una barra */
      if ((p.wheelspin || 0) > 0.12) {
        x.fillStyle = 'rgba(255,150,70,' + (0.35 + 0.5 * p.wheelspin).toFixed(2) + ')';
        x.font = '800 10px ui-monospace,monospace';
        x.fillText('PATINA', 0, R * 0.72);
      }
    }
    /* nitro */
    const bf = p.boostFuel / 100;
    x.beginPath(); x.arc(0, 0, R + 3, a1 - 0.1, lerp(a1, a1 - 0.62, 1 - bf) , true);
    x.strokeStyle = '#57d8ff'; x.lineWidth = 3.4; x.stroke();
    x.restore();

    /* ---- minimapa ---- */
    if (this.mc && game.showMap !== false) this.drawMinimap(game);

    /* ---- panel izquierda: vuelta / posición / tiempo ---- */
    const hudLines = game.hudLines ? game.hudLines() : [];
    x.save();
    x.font = '700 13px system-ui,sans-serif';
    /* empieza por debajo de la tira de contexto del DOM (arriba al centro): así
       la esquina superior izquierda la controla sólo este panel y nada se pisa */
    let yy = 72;
    for (const l of hudLines) {
      const big = l.big;
      x.textAlign = 'left';
      x.fillStyle = 'rgba(6,8,14,0.42)';
      const tw = x.measureText(l.v).width + (big ? 30 : 22);
      roundRect(x, 14, yy - 13, tw, big ? 30 : 24, 6); x.fill();
      x.fillStyle = 'rgba(170,195,235,0.8)';
      x.fillText(l.k, 22, yy + 3);
      x.fillStyle = l.col || '#f2f7ff';
      x.font = (big ? '700 19px' : '700 15px') + ' ui-monospace,Menlo,Consolas,monospace';
      x.fillText(l.v, 22 + x.measureText(l.k).width * (big ? 1.16 : 1) + 8, yy + (big ? 5 : 3));
      x.font = '700 13px system-ui,sans-serif';
      yy += big ? 36 : 30;
    }
    /* para qué sirve este modo, siempre visible (no sólo en el menú) */
    const md = game.modeDef;
    if (md && md.win) {
      const maxW = Math.min(246, w * 0.28);
      x.font = '600 11.5px system-ui,sans-serif';
      const words = ('objetivo: ' + md.win).split(' ');
      let l1 = '', l2 = '';
      for (let k = 0; k < words.length; k++) {
        const word = words[k];
        if (!l2 && x.measureText((l1 ? l1 + ' ' : '') + word).width <= maxW) l1 = (l1 ? l1 + ' ' : '') + word;
        else l2 = l2 ? l2 + ' ' + word : word;
      }
      x.fillStyle = 'rgba(6,8,14,0.40)';
      roundRect(x, 14, yy - 10, maxW + 16, l2 ? 36 : 21, 6); x.fill();
      x.fillStyle = 'rgba(178,204,240,0.74)';
      x.fillText(l1, 22, yy + 4);
      if (l2) x.fillText(l2, 22, yy + 18);
    }
    x.restore();

    /* ---- barra de derrape / puntos ---- */
    if (game.driftHud && game.driftHud.cur > 0) {
      const d = game.driftHud;
      x.save();
      x.textAlign = 'center';
      const bw = Math.min(420, w * 0.5);
      x.fillStyle = 'rgba(6,8,14,0.5)';
      roundRect(x, w / 2 - bw / 2, h - 92, bw, 46, 10); x.fill();
      x.fillStyle = '#ffd453'; x.font = '700 26px ui-monospace,monospace';
      x.fillText('+' + Math.round(d.cur), w / 2, h - 60);
      if (d.chain > 1) { x.fillStyle = '#ff8b3d'; x.font = '700 15px ui-monospace,monospace'; x.fillText('x' + d.chain.toFixed(1), w / 2 + bw * 0.32, h - 62); }
      const gw = bw - 24;
      x.fillStyle = 'rgba(255,255,255,0.13)'; x.fillRect(w / 2 - gw / 2, h - 54, gw, 6);
      x.fillStyle = d.tube >= 1 ? '#ff6a3d' : '#ffd453';
      x.fillRect(w / 2 - gw / 2, h - 54, gw * clamp(d.tube, 0, 1), 6);
      x.restore();
    }
    /* ---- mensajes ---- */
    if (this.msgT > 0 && this.msg) {
      x.save();
      x.textAlign = 'center';
      const al = clamp(this.msgT * 2.2, 0, 1);
      x.globalAlpha = al;
      x.fillStyle = 'rgba(6,8,14,0.62)';
      x.font = '800 22px system-ui,sans-serif';
      const tw = x.measureText(this.msg).width;
      roundRect(x, w / 2 - tw / 2 - 20, h * 0.24 - 26, tw + 40, 46, 10); x.fill();
      x.fillStyle = '#eaf3ff';
      x.fillText(this.msg, w / 2, h * 0.24 + 6);
      x.restore();
    }
    /* avisos de modo */
    if (game.warnText) {
      x.save(); x.textAlign = 'center'; x.fillStyle = '#ff6b6b';
      x.font = '800 16px system-ui,sans-serif';
      x.fillText(game.warnText, w / 2, h - 24);
      x.restore();
    }
  };

  HUD.prototype.drawMinimap = function (game) {
    const x = this.mc, S = this.ms || 168;
    const W = game.world, mm = W.minimap, tr = W.track;
    x.clearRect(0, 0, S, S);
    const pad = 10, sc = (S - pad * 2) / (mm.world * 2);
    const px = (wx) => S / 2 + wx * sc, pz = (wz) => S / 2 + wz * sc;
    x.save();
    x.fillStyle = 'rgba(6,10,18,0.45)';
    roundRect(x, 0, 0, S, S, 12); x.fill();
    /* pista */
    x.beginPath();
    for (let i = 0; i <= tr.n; i++) {
      const j = i % tr.n;
      const X = px(mm.xs[j]), Z = pz(mm.zs[j]);
      if (i === 0) x.moveTo(X, Z); else x.lineTo(X, Z);
    }
    x.strokeStyle = 'rgba(226,238,255,0.55)'; x.lineWidth = Math.max(3, W.spec.w * sc * 1.4); x.lineJoin = 'round'; x.stroke();
    x.strokeStyle = 'rgba(255,255,255,0.16)'; x.lineWidth = Math.max(6, W.spec.w * sc * 2.2); x.stroke();
    /* meta */
    const g0 = tr.centers[0];
    x.fillStyle = '#eafff0';
    x.fillRect(px(g0[0]) - 3, pz(g0[1]) - 3, 6, 6);
    /* checkpoints pendientes */
    if (game.nextCk) {
      const c = game.nextCk;
      x.beginPath(); x.arc(px(c.x), pz(c.z), 4.5, 0, 6.283);
      x.fillStyle = 'rgba(120,230,255,0.9)'; x.fill();
    }
    /* coches */
    for (const car of game.cars) {
      const isP = car.isPlayer;
      x.beginPath(); x.arc(px(car.pos[0]), pz(car.pos[2]), isP ? 4.2 : 3.2, 0, 6.283);
      x.fillStyle = isP ? '#fff' : (car.isCop ? '#4ea0ff' : car.color);
      x.fill();
      if (isP) { x.strokeStyle = 'rgba(0,0,0,0.5)'; x.lineWidth = 1.2; x.stroke(); }
    }
    x.restore();
  };
  function roundRect(x, a, b, w, h, r) {
    x.beginPath();
    x.moveTo(a + r, b); x.lineTo(a + w - r, b); x.quadraticCurveTo(a + w, b, a + w, b + r);
    x.lineTo(a + w, b + h - r); x.quadraticCurveTo(a + w, b + h, a + w - r, b + h);
    x.lineTo(a + r, b + h); x.quadraticCurveTo(a, b + h, a, b + h - r);
    x.lineTo(a, b + r); x.quadraticCurveTo(a, b, a + r, b);
    x.closePath();
  }

  /* ================================================================== *
   *  MENÚS / pantallas
   * ================================================================== */
  function Screens(root, cb) {
    this.root = root; this.cb = cb;
    root.innerHTML =
      '<div class="scr scr-menu" data-s="menu">' +
      '  <div class="brand"><span class="b1">CAR</span><span class="b2">WARS</span><i class="tag">3D · sin conexión</i></div>' +
      '  <div class="cols">' +
      '    <div class="col"><h3>Circuito</h3><div class="cards maps"></div></div>' +
      '    <div class="col"><h3>Modo</h3><div class="cards modes"></div></div>' +
      '    <div class="col"><h3>Coche</h3><div class="cards cars"></div><div class="stats"></div></div>' +
      '  </div>' +
      '  <div class="row opts">' +
      '    <label class="chk"><input type="checkbox" data-o="shadows" checked><span>Sombras</span></label>' +
      '    <label class="chk"><input type="checkbox" data-o="particles" checked><span>Humo y chispas</span></label>' +
      '    <label class="chk"><input type="checkbox" data-o="sound" checked><span>Sonido</span></label>' +

      '  </div>' +
      '  <div class="row foot"><button class="btn primary" data-a="start">SALIR A PISTA</button>' +
      '  <span class="hint">teclado WASD/flechas · SHIFT o Espacio = derrape · E nitro · C cámara · R reponer · P pausa</span></div>' +
      '</div>' +
      '<div class="scr scr-pause" data-s="pause" hidden><div class="panel">' +
      '  <h2>Pausa</h2><div class="pinfo"></div>' +
      '  <button class="btn primary" data-a="resume">Continuar</button>' +
      '  <button class="btn" data-a="cam">Cambiar cámara</button>' +
      '  <button class="btn" data-a="restart">Reiniciar</button>' +
      '  <button class="btn ghost" data-a="menu">Menú principal</button>' +
      '</div></div>' +
      '<div class="scr scr-result" data-s="result" hidden><div class="panel wide">' +
      '  <h2 class="rt">Resultado</h2><div class="rtable"></div>' +
      '  <div class="rbtns"><button class="btn primary" data-a="again">Otra vez</button>' +
      '  <button class="btn" data-a="menu">Menú</button></div>' +
      '</div></div>';
    this.el = {};
    for (const s of root.querySelectorAll('.scr')) this.el[s.getAttribute('data-s')] = s;
    root.addEventListener('click', (e) => {
      const b = e.target.closest ? e.target.closest('[data-a]') : null;
      if (b && this.cb[b.getAttribute('data-a')]) this.cb[b.getAttribute('data-a')](b);
      const inp = e.target.closest ? e.target.closest('.cards .card') : null;
      if (inp) this.select(inp);
    });
    root.addEventListener('change', (e) => {
      if (e.target.matches('[data-o]')) this.opts()[e.target.getAttribute('data-o')] = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    });
  }
  Screens.prototype.select = function (card) {
    const grp = card.parentElement;
    Array.prototype.forEach.call(grp.children, c => c.classList.remove('sel'));
    card.classList.add('sel');
    this.sync();
    if (this.cb.pick) this.cb.pick();
  };
  Screens.prototype.opts = function () {
    const o = {};
    this.root.querySelectorAll('[data-o]').forEach(e => { o[e.getAttribute('data-o')] = e.type === 'checkbox' ? e.checked : e.value; });
    return o;
  };
  Screens.prototype.fill = function (maps, modes, cars, rec) {
    const mk = (list, cls, key, html) => {
      const box = this.root.querySelector('.' + cls);
      box.innerHTML = list.map((m, i) => '<div class="card' + (i === 0 ? ' sel' : '') + '" data-k="' + m.id + '">' + html(m, i) + '</div>').join('');
    };
    mk(maps, 'maps', 'map', m => '<b>' + m.name + '</b><small>' + m.blurb + '</small><em class="mw">' + m.time + '</em>');
    mk(modes, 'modes', 'mode', m => '<b>' + m.name + '</b><small>' + m.blurb + '</small>' +
      (m.info ? '<span class="fine">' + m.info + '</span>' : '') +
      (m.win ? '<span class="win">→ ' + m.win + '</span>' : ''));
    mk(cars, 'cars', 'car', c => '<b>' + c.name + '</b><small>' + c.blurb + '</small>');
    this.maps = maps; this.modes = modes; this.cars = cars;
    this.showStats(cars[0]);
    this.root.querySelectorAll('.maps .card').forEach((el, i) => {
      const m = maps[i], box = el.querySelector('.mw');
      if (!box) return;
      const lapR = rec['lap:' + m.id + ':race'], raceR = rec['race:' + m.id], driftR = rec['drift:' + m.id];
      const parts = [];
      if (lapR && lapR.ms) parts.push('v ' + G.fmtMs(lapR.ms));
      if (raceR && raceR.ms) parts.push('carr ' + G.fmtMs(raceR.ms));
      if (driftR && driftR.p) parts.push(driftR.p + ' pts');
      box.textContent = parts.length ? parts.join(' · ') : (m.time || '');
    });
  };
  Screens.prototype.showStats = function (c) {
    const s = this.root.querySelector('.stats');
    const st = c.stats;
    const bar = (k, v, txt) => '<div class="st"><span>' + k + '</span><i><b style="width:' +
      Math.round(clamp(v, 0, 1) * 100) + '%"></b></i>' + (txt ? '<u>' + txt + '</u>' : '') + '</div>';
    const ch = {
      coupe: 'neutro y predecible: es el listón con el que se comparan los demás',
      muscle: 'V8 de par: te arranca de las manos en recta y patina en 1ª; suelto de culo al entrar y frena tarde',
      hatch: 'delantera nerviosa en curva lenta, subvirador en rápida y sin aire por encima de 200',
      suv: '4x4 alto y blando: sale como un tiro en tierra, baila en asfalto y no frena',
      proto: '7 marchas a 11 000 rpm con carga aerodinámica: letal y frágil, castiga cualquier toque'
    }[c.id] || 'un poco de todo y perfecto en nada';
    const drive = { rwd: 'trasera', fwd: 'delantera', awd: '4x4' }[st.drive] || '—';
    const ride = clamp(st.ride || 1, 0, 1.3);
    s.innerHTML =
      '<div class="shead">' + c.name +
      '<em>' + st.mass + ' kg · tracción ' + drive + ' · ' + (st.gears || 5) +
      ' marchas · corte ' + (Math.round((st.redline || 7000) / 100) / 10) + ' krpm · ' +
      (st.cyl || 6) + ' cilindros</em></div>' +
      bar('empuje', (st.power * (st.torqueK || 1)) / 1.6, 'par ' + Math.round((st.torqueK || 1) * 100) + '%') +
      bar('puntería', st.top / 300, st.top + ' km/h') +
      bar('agarre', st.grip / 1.2, Math.round(st.grip * 100) + '%') +
      bar('frenada', st.brake / 1.15, Math.round(st.brake * 100) + '%') +
      bar('agilidad', (st.agility || 1) / 1.3, (st.agility || 1) < 0.9 ? 'perezoso' : ((st.agility || 1) > 1.1 ? 'cuchillo' : 'normal')) +
      bar('equilibrio', 0.5 + (st.balance || 0) * 0.5, (st.balance || 0) > 0.2 ? 'se suelta detrás' : ((st.balance || 0) < -0.1 ? 'se abre delante' : 'neutro')) +
      bar('tierra', (st.offRoad || 0.75) / 1.05, (st.offRoad || 0.75) > 0.9 ? 'agarra en barro' : 'patina en barro') +
      bar('confort', 1.25 - ride, ride > 1 ? 'blanda, se menea' : (ride < 0.5 ? 'dura, sin mullido' : 'deportiva')) +
      bar('derrape', (st.drift || 1) / 1.4, 'facilidad para cruzarse') +
      bar('chapa', 1.4 - (st.fragility || 1), (st.fragility || 1) > 1.2 ? 'se daña de más' : 'aguanta el golpe') +
      '<div class="sfoot">' + ch + '</div>';
  };
  Screens.prototype.sync = function () {
    const get = cls => { const c = this.root.querySelector('.' + cls + ' .card.sel'); return c ? c.getAttribute('data-k') : null; };
    this.choice = { map: get('maps'), mode: get('modes'), car: get('cars'), opts: this.opts() };
    const car = this.cars.find(c => c.id === this.choice.car) || this.cars[0];
    this.showStats(car);
    return this.choice;
  };
  Screens.prototype.show = function (name) {
    for (const k in this.el) this.el[k].hidden = (k !== name);
    this.root.classList.toggle('hasScreen', !!name);
  };
  Screens.prototype.result = function (title, rows) {
    const box = this.root.querySelector('.rtable');
    this.el.result.querySelector('.rt').textContent = title;
    box.innerHTML = rows.map(r =>
      '<div class="rrow' + (r.hi ? ' hi' : '') + (r.head ? ' head' : '') + '">' +
      r.cells.map((c, i) => '<span class="c' + i + '">' + c + '</span>').join('') + '</div>').join('');
  };
  Screens.prototype.pauseInfo = function (html) {
    const p = this.el.pause.querySelector('.pinfo'); if (p) p.innerHTML = html;
  };

  G.Input = Input;
  G.TouchControls = TouchControls;
  G.HUD = HUD;
  G.Screens = Screens;
  G.roundRect2 = roundRect;
})(window.CW);

</script>
<script>/* js/audio.js */
/* =====================================================================
   audio.js — motor de sonido 100 % procedural (WebAudio).
   Sin ficheros: motor = osciladores + filtros; rodadas/aire = ruido;
   avisos = tonos. Todo se apaga solo si no hay AudioContext.
   ===================================================================== */
(function (G) {
  'use strict';
  const clamp = G.clamp;

  function makeNoise(ctx, secs) {
    const n = Math.floor(ctx.sampleRate * secs);
    const b = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = b.getChannelData(0);
    let last = 0;
    for (let i = 0; i < n; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;         /* ruido rosado aproximado */
      d[i] = last * 3.2;
    }
    return b;
  }

  function Sound(opts) {
    opts = opts || {};
    this.ok = false;
    this.muted = !!opts.muted;
    this.vol = opts.volume == null ? 0.9 : opts.volume;
    this.ctx = null;
    this.voices = [];
    this.pending = [];
    this.bpm = 126; this.beat = 0; this.nextNote = 0;
    this.musicOn = opts.music !== false;
  }
  Sound.prototype.tryStart = function () {
    if (this.ok || this.dead) return this.ok;
    const AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!AC) { this.dead = true; return false; }
    try {
      const ctx = this.ctx = new AC({ latencyHint: 'interactive' });
      const master = this.master = ctx.createGain();
      master.gain.value = this.muted ? 0 : this.vol;
      const comp = this.comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 22; comp.ratio.value = 4;
      comp.attack.value = 0.004; comp.release.value = 0.16;
      master.connect(comp); comp.connect(ctx.destination);
      /* buses */
      this.busEngine = ctx.createGain(); this.busEngine.gain.value = 0.55; this.busEngine.connect(master);
      this.busFx = ctx.createGain(); this.busFx.gain.value = 0.9; this.busFx.connect(master);
      this.busMusic = ctx.createGain(); this.busMusic.gain.value = 0.0; this.busMusic.connect(master);
      this.noise = makeNoise(ctx, 2);
      /* rodadas (ruido filtrado, compartido) */
      const sk = ctx.createBufferSource(); sk.buffer = this.noise; sk.loop = true;
      const skF = ctx.createBiquadFilter(); skF.type = 'bandpass'; skF.frequency.value = 1250; skF.Q.value = 0.7;
      const skG = ctx.createGain(); skG.gain.value = 0;
      sk.connect(skF); skF.connect(skG); skG.connect(this.busFx); sk.start(0);
      this.skid = { g: skG, f: skF };
      /* aire */
      const ai = ctx.createBufferSource(); ai.buffer = this.noise; ai.loop = true;
      const aiF = ctx.createBiquadFilter(); aiF.type = 'highpass'; aiF.frequency.value = 700;
      const aiG = ctx.createGain(); aiG.gain.value = 0;
      ai.connect(aiF); aiF.connect(aiG); aiG.connect(this.busFx); ai.start(0);
      this.wind = { g: aiG, f: aiF };
      this.ok = true;
      /* reintentar voces creadas antes de arrancar */
      for (const p of this.pending) this.addCar(p);
      this.pending.length = 0;
      return true;
    } catch (e) { this.dead = true; return false; }
  };
  Sound.prototype.resume = function () {
    if (!this.tryStart()) return;
    if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => { });
  };
  Sound.prototype.setMuted = function (m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : this.vol;
  };
  Sound.prototype.addCar = function (o) {
    if (!this.ok) { this.pending.push(o); return null; }
    const ctx = this.ctx;
    const cyl = o.cyl || 6;
    /* un V8 cruje grave y con galope; un 3 cilindros es una avispa chillona;
       un 4 turbo pita; un prototipo de 11 000 rpm aúlla. Todo sale del nº de
       cilindros, el corte de encendido y si lleva turbo (datos de meshes.js). */
    const pitch = 1.28 - 0.045 * cyl;
    const lope = cyl >= 8 ? 0.11 : (cyl <= 3 ? 0.085 : (cyl === 4 ? 0.05 : 0.028));
    const v = {
      name: o.name || 'car', player: !!o.player, cyl,
      redline: o.redline || 7000, turbo: !!o.turbo, drive: o.drive || 'rwd',
      pitch, lope, charge: cyl / 6
    };
    v.g = ctx.createGain(); v.g.gain.value = 0;
    v.pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    v.lp = ctx.createBiquadFilter(); v.lp.type = 'lowpass'; v.lp.frequency.value = 1800; v.lp.Q.value = 0.6;
    v.osc1 = ctx.createOscillator(); v.osc1.type = 'sawtooth';
    v.osc2 = ctx.createOscillator(); v.osc2.type = cyl >= 8 ? 'square' : 'sawtooth'; v.osc2.detune.value = cyl >= 8 ? 14 : 6;
    v.osc3 = ctx.createOscillator(); v.osc3.type = cyl <= 4 ? 'square' : 'triangle';
    v.g1 = ctx.createGain(); v.g1.gain.value = 0.50;
    v.g2 = ctx.createGain(); v.g2.gain.value = 0.26 + (cyl >= 8 ? 0.16 : 0);
    v.g3 = ctx.createGain(); v.g3.gain.value = 0.14;
    /* sub-grave: el retumbo del escape gordo (V8 / motor largo) */
    v.sub = ctx.createOscillator(); v.sub.type = 'sine';
    v.gs = ctx.createGain(); v.gs.gain.value = (cyl >= 8 ? 0.34 : (cyl <= 4 ? 0.20 : 0.10));
    /* pito del turbo */
    v.whine = ctx.createOscillator(); v.whine.type = 'sine';
    v.gw = ctx.createGain(); v.gw.gain.value = 0;
    /* ruido de escape/admisión */
    v.noise = ctx.createBufferSource(); v.noise.buffer = this.noise; v.noise.loop = true;
    v.nf = ctx.createBiquadFilter(); v.nf.type = 'bandpass'; v.nf.frequency.value = 300; v.nf.Q.value = 0.8;
    v.ng = ctx.createGain(); v.ng.gain.value = 0.14;
    /* LFO de galope (desuniformidad de encendido) */
    v.lfo = ctx.createOscillator(); v.lfo.type = 'sine';
    v.lfoG = ctx.createGain(); v.lfoG.gain.value = 0;
    v.osc1.connect(v.g1); v.g1.connect(v.lp);
    v.osc2.connect(v.g2); v.g2.connect(v.lp);
    v.osc3.connect(v.g3); v.g3.connect(v.lp);
    v.sub.connect(v.gs); v.gs.connect(v.lp);
    v.whine.connect(v.gw); v.gw.connect(v.lp);
    v.noise.connect(v.nf); v.nf.connect(v.ng); v.ng.connect(v.lp);
    v.lfo.connect(v.lfoG); v.lfoG.connect(v.g.gain);
    v.lp.connect(v.g);
    if (v.pan) { v.g.connect(v.pan); v.pan.connect(this.busEngine); } else v.g.connect(this.busEngine);
    const t = ctx.currentTime;
    v.osc1.start(t); v.osc2.start(t); v.osc3.start(t); v.sub.start(t); v.whine.start(t); v.noise.start(t); v.lfo.start(t);
    this.voices.push(v);
    return v;
  };
  Sound.prototype.update = function (cars, listener, dt, info) {
    if (!this.ok) return;
    const ctx = this.ctx, t = ctx.currentTime, K = 0.05;
    info = info || {};
    this.intensity = G.damp(this.intensity || 0, clamp(info.intensity == null ? 0.4 : info.intensity, 0, 1), 1.4, dt || 0.016);
    /* 1) motor de cada coche: el primero es el del jugador */
    this._f = (this._f | 0) + 1;
    for (let i = 0; i < this.voices.length; i++) {
      const v = this.voices[i];
      const car = cars[i];
      if (!car) { v.g.gain.setTargetAtTime(0, t, K); continue; }
      /* los motores ajenos se refrescan a 30 Hz con suavizado: en un Chromebook
         son 5 voces y no se nota (el tuyo va a pleno cada fotograma) */
      if (!v.player && (this._f & 1)) continue;
      const dx = car.pos[0] - listener.x, dz = car.pos[2] - listener.z;
      const d = Math.hypot(dx, dz);
      const near = clamp(1 - d / (v.player ? 260 : 95), 0, 1);
      const away = v.player ? 1 : near * near;
      const rpm = clamp(car.engineRPM || 900, 600, v.redline * 1.12);
      const rpmHz = rpm / 60;
      const u = rpm / v.redline;
      const base = rpmHz * (2.6 - 0.09 * v.cyl) * v.pitch;
      const load = clamp(Math.abs(car.throttle) * 0.62 + clamp(car.speed / 60, 0, 1) * 0.32 + (car.brake > 0.2 ? 0.12 : 0), 0, 1.3);
      const spin = clamp(car.wheelspin || 0, 0, 1);
      v.osc1.frequency.setTargetAtTime(base, t, K);
      v.osc2.frequency.setTargetAtTime(base * 0.5, t, K);
      v.osc3.frequency.setTargetAtTime(base * (2.98 + 0.02 * v.cyl), t, K);
      v.sub.frequency.setTargetAtTime(base * 0.5, t, K);
      v.lfo.frequency.setTargetAtTime(Math.max(3.5, rpmHz * 0.5), t, 0.2);
      v.lfoG.gain.setTargetAtTime(v.lope * (0.30 + load * 0.5) * (v.player ? 1 : 0.6), t, 0.1);
      v.lp.frequency.setTargetAtTime(600 + 3200 * near * (0.32 + load) + (car.boost ? 2400 : 0) + u * 900, t, K);
      v.g1.gain.setTargetAtTime(0.30 + 0.24 * load, t, 0.08);
      v.g2.gain.setTargetAtTime(0.14 + 0.20 * load + (v.cyl >= 8 ? 0.10 : 0), t, 0.08);
      v.g3.gain.setTargetAtTime(0.05 + 0.15 * clamp((u - 0.45) / 0.55, 0, 1), t, 0.08);
      v.gs.gain.setTargetAtTime((v.cyl >= 8 ? 0.30 : 0.10) * (0.4 + load) * (1 + spin * 0.7), t, 0.09);
      /* escape: más abierto cuanto más cerca + patinando */
      v.ng.gain.setTargetAtTime(0.10 + 0.16 * load + 0.34 * spin, t, 0.06);
      v.nf.frequency.setTargetAtTime(190 + 1050 * near + 620 * u + 900 * spin, t, 0.08);
      if (v.turbo) {
        v.whine.frequency.setTargetAtTime(900 + 44 * rpmHz + (car.boost ? 900 : 0), t, 0.09);
        v.gw.gain.setTargetAtTime(0.020 * clamp((u - 0.25) * 2.1, 0, 1) * (0.4 + load), t, 0.1);
      }
      v.g.gain.setTargetAtTime((v.player ? 0.30 : 0.19) * (0.26 + load * 0.82) * away * (1 - 0.25 * clamp(car.damage, 0, 1)), t, 0.07);
      if (v.pan) {
        const cy = Math.cos(-listener.yaw), sy = Math.sin(-listener.yaw);
        const rx = dx * cy - dz * sy;
        v.pan.pan.setTargetAtTime(clamp(rx / 26, -1, 1) * (v.player ? 0 : 0.85), t, 0.05);
      }
      /* golpe de cambio / contraexplosión (sólo el jugador, para no multiplicar nodos) */
      if (v.player && car.shiftFx > 0.5) { car.shiftFx = 0; this.pop(t, 0.5 + 0.5 * load); }
      if (v.player && spin > 0.42) this.skitch(0.18 + 0.5 * spin);
    }
    /* 2) rodadas + viento */
    const p = cars[0];
    if (p) {
      const dirt = p.onRoad > 0.5 ? 0 : 1;
      const sk = p.drifting ? clamp(Math.abs(p.vr) / 9, 0, 1) * (1 - 0.5 * dirt) : 0;
      const spin = clamp(p.wheelspin || 0, 0, 1);
      const skv = Math.max(sk, spin * 0.75);
      this.skid.g.gain.setTargetAtTime(skv * (info.skidVol || 0.5), t, 0.05);
      this.skid.f.frequency.setTargetAtTime(dirt ? 620 : 900 + 1500 * clamp(Math.abs(p.vr) / 12, 0, 1), t, 0.08);
      const wnd = clamp(Math.pow(p.speed / 70, 1.7), 0, 1) * (dirt ? 0.7 : 0.42);
      this.wind.g.gain.setTargetAtTime(wnd * 0.30, t, 0.08);
      this.wind.f.frequency.setTargetAtTime(500 + p.speed * 22, t, 0.1);
    }
    if (this.musicOn) this.tickMusic(t, this.intensity);
  };
  /* pequeña explosión de escape (cambio de marcha / levanta el pie) */
  Sound.prototype.pop = function (t, g) {
    if (!this.ok) return;
    const ctx = this.ctx;
    const s = ctx.createBufferSource(); s.buffer = this.noise;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 420 + Math.random() * 500; bp.Q.value = 0.9;
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(0.20 * clamp(g || 0.6, 0, 1.4), t);
    gn.gain.exponentialRampToValueAtTime(0.001, t + 0.10);
    s.connect(bp); bp.connect(gn); gn.connect(this.busEngine);
    s.start(t, Math.random() * 1.5); s.stop(t + 0.12);
  };
  Sound.prototype.stopVoices = function () {
    for (const v of this.voices) {
      try { v.osc1.stop(); v.osc2.stop(); v.osc3.stop(); v.noise.stop(); } catch (e) { }
    }
    this.voices.length = 0; this.pending.length = 0;
  };
  /* ---- efectos puntuales ---- */
  Sound.prototype.blip = function (freq, dur, type, gain, slide) {
    if (!this.ok) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t + dur);
    f.type = 'lowpass'; f.frequency.value = 5200;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime((gain == null ? 0.22 : gain), t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
    o.connect(f); f.connect(g); g.connect(this.busFx);
    o.start(t); o.stop(t + dur + 0.02);
  };
  Sound.prototype.thud = function (power) {
    if (!this.ok) return;
    const ctx = this.ctx, t = ctx.currentTime, p = clamp(power, 0.15, 1);
    /* golpe grave */
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(120 + 90 * p, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 0.26);
    g.gain.setValueAtTime(0.5 * p, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
    o.connect(g); g.connect(this.busFx); o.start(t); o.stop(t + 0.36);
    /* chapa */
    const s = ctx.createBufferSource(); s.buffer = this.noise;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500 + 900 * p; bp.Q.value = 1.1;
    const ng = ctx.createGain(); ng.gain.setValueAtTime(0.42 * p, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    s.connect(bp); bp.connect(ng); ng.connect(this.busFx); s.start(t, Math.random()); s.stop(t + 0.24);
  };
  Sound.prototype.skitch = function (v) { if (this.ok) this.skid.g.gain.setTargetAtTime(clamp(v, 0, 1) * 0.5, this.ctx.currentTime, 0.02); };
  Sound.prototype.whoosh = function (p) {
    if (!this.ok) return;
    const ctx = this.ctx, t = ctx.currentTime;
    const s = ctx.createBufferSource(); s.buffer = this.noise; s.loop = false;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.6;
    f.frequency.setValueAtTime(340, t); f.frequency.exponentialRampToValueAtTime(3400, t + 0.5);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.001, t);
    g.gain.linearRampToValueAtTime(0.34 * clamp(p || 1, 0, 1), t + 0.08);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
    s.connect(f); f.connect(g); g.connect(this.busFx); s.start(t); s.stop(t + 0.6);
  };
  Sound.prototype.chord = function (freqs, dur, gain) {
    if (!this.ok) return;
    freqs.forEach((f, i) => setTimeout(() => this.blip(f, dur || 0.5, 'triangle', gain || 0.16), i * 55));
  };
  /* ---- música: pulso sencillo de 4 tiempos, se silencia sola si no se escucha ---- */
  Sound.prototype.tickMusic = function (t, intensity) {
    const ctx = this.ctx;
    const inten = clamp(intensity || 0, 0, 1);
    /* el pulso se acelera cuando la carrera aprieta (persecución, adelantamientos) */
    this.bpm = G.damp(this.bpm || 126, 118 + 30 * inten, 0.5, 0.05);
    const spb = 60 / this.bpm / 2;
    if (!this.musicStart) this.musicStart = t;
    let guard = 0;
    while (this.nextNote < t + 0.25 && guard++ < 12) {
      if (this.nextNote === 0) this.nextNote = t + 0.05;
      const b = this.beat % 16;
      const bar = ((this.beat / 16) | 0) % 4;
      const tn = this.nextNote;
      /* batería */
      if (b % 4 === 0) this.drum(tn, 0.9, 'kick');
      if (b % 8 === 4) this.drum(tn, 0.5 + 0.2 * inten, 'snare');
      if (inten > 0.55 && b % 8 === 7) this.drum(tn, 0.22, 'snare');
      if (b % 2 === 1) this.drum(tn, 0.10 + 0.12 * inten, 'hat');
      /* bajo: A - F - C - G, enA menor, con la octava cuando acelera */
      const root = [55, 43.65, 65.41, 49][bar];
      const pat = [0, 0, 7, 0, 5, 0, 3, 0, 0, 0, 7, 10, 5, 0, 3, 0];
      const n = root * Math.pow(2, pat[b] / 12);
      this.bass(tn, n, spb * 0.92);
      /* capa aguda: arpegio de acorde, sólo si la cosa está alta de vueltas */
      if (inten > 0.30) {
        const triad = [[9, 12, 16], [8, 12, 15], [7, 12, 16], [7, 10, 14]][bar];
        const pick = triad[(this.beat * 3) % 3];
        this.lead(tn, root * 4 * Math.pow(2, pick / 12), spb * (0.55 + 0.3 * inten), 0.035 + 0.05 * inten);
      }
      /* platillo al empezar compás con toda la música encima */
      if (inten > 0.78 && b === 0) this.drum(tn, 0.16, 'hat');
      this.nextNote += spb; this.beat++;
    }
  };
  Sound.prototype.lead = function (t, f, dur, g) {
    const ctx = this.ctx;
    const o = ctx.createOscillator(), gn = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = 'triangle'; o.frequency.value = f;
    lp.type = 'lowpass'; lp.frequency.value = 2600 + 3000 * g * 6;
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.linearRampToValueAtTime(g, t + 0.02);
    gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(lp); lp.connect(gn); gn.connect(this.busMusic);
    o.start(t); o.stop(t + dur + 0.02);
  };
  Sound.prototype.drum = function (t, g, kind) {
    const ctx = this.ctx;
    if (kind === 'kick') {
      const o = ctx.createOscillator(), gn = ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(128, t); o.frequency.exponentialRampToValueAtTime(41, t + 0.13);
      gn.gain.setValueAtTime(0.5 * g, t); gn.gain.exponentialRampToValueAtTime(0.001, t + 0.19);
      o.connect(gn); gn.connect(this.busMusic); o.start(t); o.stop(t + 0.2);
    } else {
      const s = ctx.createBufferSource(); s.buffer = this.noise;
      const f = ctx.createBiquadFilter(); f.type = kind === 'hat' ? 'highpass' : 'bandpass';
      f.frequency.value = kind === 'hat' ? 7200 : 1900;
      const gn = ctx.createGain();
      gn.gain.setValueAtTime(0.26 * g, t); gn.gain.exponentialRampToValueAtTime(0.001, t + (kind === 'hat' ? 0.05 : 0.14));
      s.connect(f); f.connect(gn); gn.connect(this.busMusic); s.start(t, Math.random()); s.stop(t + 0.16);
    }
  };
  Sound.prototype.bass = function (t, f, dur) {
    const ctx = this.ctx;
    const o = ctx.createOscillator(), gn = ctx.createGain(), lp = ctx.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = f;
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(400, t); lp.frequency.exponentialRampToValueAtTime(160, t + dur);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(0.3, t + 0.02);
    gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(lp); lp.connect(gn); gn.connect(this.busMusic); o.start(t); o.stop(t + dur + 0.02);
  };
  Sound.prototype.setMusic = function (on, amt) {
    this.musicOn = on;
    if (this.ok) this.busMusic.gain.setTargetAtTime(on ? (amt == null ? 0.16 : amt) : 0, this.ctx.currentTime, 0.4);
  };
  Sound.prototype.setEngineMaster = function (v) { if (this.ok) this.busEngine.gain.setTargetAtTime(v, this.ctx.currentTime, 0.2); };

  G.Sound = Sound;
  G.makeSound = function (o) { return new Sound(o); };
})(window.CW);

</script>
<script>/* js/game.js */
/* =====================================================================
   game.js — bucle principal, modos de juego, cámara, luces, récords y
   arranque (bootstrap) con la interfaz.  Sin módulos ni red.
   ===================================================================== */
(function (G) {
  'use strict';
  const M = G.M, clamp = G.clamp, lerp = G.lerp, MAXL = G.MAX_LIGHTS || 16;

  /* ------------------------------------------------------------------ *
   *  Modos
   * ------------------------------------------------------------------ */
  const MODES = {
    free: {
      id: 'free', name: 'V libre', blurb: 'Sin cronómetro: rodadura libre con tráfico IA',
      info: 'sin cronómetro · 4 coches de tráfico · fuera de pista permitido',
      win: 'sin metas: rodar, aprender los pianos o probar el coche',
      laps: 0, rivals: 4, aiSpeed: 0.78, strictWalls: false, live: false,
      hud(g) {
        return [
          { k: 'MODO', v: 'V LIBRE', big: false },
          { k: 'VUELTA', v: (g.player.lap + 1) + '', big: false },
          { k: 'LONGITUD', v: (g.world.track.total | 0) + ' m', big: false },
          { k: 'MEJOR', v: g.player.bestLap ? G.fmtTime(g.player.bestLap) : '—', big: false }
        ];
      },
      lapDone(g, car) { if (car.isPlayer && car.lastLap) g.notify('vuelta ' + G.fmtTime(car.lastLap)); }
    },
    race: {
      id: 'race', name: 'Carrera', blurb: 'Vueltas contra 5 rivales de IA, posición en vivo',
      info: '3 vueltas (2-8 en el menú) · 5 rivales · cuenta atrás de 3 s',
      win: 'cruzar 1º; el puesto se calcula con el progreso de vuelta',
      laps: 3, rivals: 5, aiSpeed: 1.0, strictWalls: true, live: true,
      setup(g) { g.state.countdown = 3.4; g.state.go = false; },
      update(g, dt) {
        const st = g.state;
        if (st.countdown > 0) {
          st.countdown -= dt;
          for (const c of g.cars) { c.throttle = 0; c.brake = 1; c.steer = 0; }
          if (st.countdown <= 0) { st.go = true; g.hud.toast('¡ADELANTE!', 1.1); g.sound.ok && g.sound.whoosh(1); }
          else {
            const s = Math.ceil(st.countdown);
            if (s !== st.lastCount) { st.lastCount = s; g.hud.toast(s + '', 0.7); g.sound.ok && g.sound.blip(520 - s * 60, 0.16, 'square', 0.2); }
          }
          return false;           /* no se simula la clasificación */
        }
        return true;
      },
      hud(g) {
        return [
          { k: 'VUELTA', v: (Math.min(g.player.lap + 1, g.laps)) + '/' + g.laps, big: true },
          { k: 'PUESTO', v: (g.player.place || 1) + 'º/' + g.cars.length, big: false, col: g.player.place === 1 ? '#8effc1' : '#f2f7ff' },
          { k: 'TIEMPO', v: G.fmtTime(g.state.clock), big: false },
          { k: 'MEJOR V.', v: g.player.bestLap ? G.fmtTime(g.player.bestLap) : '—', big: false }
        ];
      }
    },
    drift: {
      id: 'drift', name: 'Drift Attack', blurb: '90 segundos sumando ángulo y velocidad',
      info: '90 s · 0 rivales · cadena si no tocas nada',
      win: 'ángulo × velocidad encadenado: suelta el derrape antes de que baje a 0',
      laps: 0, rivals: 0, aiSpeed: 0, strictWalls: true, live: true, timed: 90,
      setup(g) { g.driftHud = { cur: 0, total: 0, chain: 1, tube: 0, cool: 0 }; },
      update(g, dt) {
        const d = g.driftHud, p = g.player;
        const ang = p.slipAngle || Math.abs(Math.atan2(p.vr, Math.max(2.5, Math.abs(p.vf))));
        if (p.drifting && ang > 0.30 && p.speed > 9 && p.onRoad > 0.35) {
          d.cool = 0;
          const q = ang * 1.9 * (0.5 + clamp(p.speed / 34, 0, 1.4));
          d.cur += q * dt * 60 * d.chain;
          d.tube = clamp(d.tube + dt * (ang > 0.5 ? 0.75 : 0.34), 0, 1.35);
          d.chain = clamp(1 + d.tube * 2.2 + ang, 1, 9.9);
          g.state.score = d.total + d.cur;
        } else {
          d.cool += dt;
          d.chain = Math.max(1, d.chain - dt * 2.6);
          d.tube = Math.max(0, d.tube - dt * 0.75);
          if (d.cool > 1.15 && d.cur > 0) { d.total += d.cur; d.cur = 0; }
        }
        if (g.state.clock > g.state.timeLimit) {
          const key = 'drift:' + g.spec.id, rec = g.records[key];
          const sc = Math.round(d.total);
          if (!rec || sc > rec.p) { g.records[key] = { p: sc, car: g.player.def.id }; G.store.set('cw_records', g.records); }
          g.finish('Tiempo agotado — ' + sc + ' puntos');
        }
        return true;
      },
      hud(g) {
        const d = g.driftHud;
        return [
          { k: 'TIEMPO', v: Math.max(0, g.state.timeLimit - g.state.clock).toFixed(1), big: true },
          { k: 'PUNTOS', v: Math.round(d.total + d.cur) + '', big: false, col: '#ffd453' },
          { k: 'CADENA', v: 'x' + d.chain.toFixed(1), big: false }
        ];
      }
    },
    attack: {
      id: 'attack', name: 'Crono CPA', blurb: 'cada checkpoint suma tiempo; no te pares',
      info: 'reloj 32 s · +12 s por checkpoint · 0 rivales · muros duros',
      win: 'sumar checkpoints sin parar; con el reloj a 0 se acabó',
      laps: 0, rivals: 0, aiSpeed: 0, strictWalls: true, live: true, startClock: 32, perCk: 12,
      setup(g) { g.state.clock = g.state.timeLeft = 32; g.state.ckHit = 0; },
      update(g, dt) {
        g.state.timeLeft -= dt;
        if (g.state.timeLeft <= 5.5 && Math.floor(g.state.timeLeft * 2) % 2 === 0 && Math.floor(g.state.timeLeft * 2) !== g.state.lastBeep) {
          g.state.lastBeep = Math.floor(g.state.timeLeft * 2);
          g.sound.ok && g.sound.blip(880, 0.07, 'square', 0.16);
        }
        if (g.state.timeLeft <= 0) { g.finish('Sin tiempo — ' + g.state.ckHit + ' checkpoints · ' + (g.player.totalProgress * g.world.track.total | 0) + ' m'); return false; }
        return true;
      },
      checkpoint(g, car) {
        if (!car.isPlayer) return;
        g.state.timeLeft += g.modeDef.perCk;
        g.state.ckHit = (g.state.ckHit || 0) + 1;
        g.hud.toast('+' + g.modeDef.perCk + ' s', 0.9);
        g.sound.ok && g.sound.chord([660, 880, 1320], 0.24, 0.14);
      },
      hud(g) {
        return [
          { k: 'TIEMPO', v: Math.max(0, g.state.timeLeft).toFixed(1), big: true, col: g.state.timeLeft < 6 ? '#ff7a6b' : '#f2f7ff' },
          { k: 'CHECKPOINTS', v: (g.state.ckHit || 0) + '', big: false },
          { k: 'DISTANCIA', v: ((g.player.totalProgress * g.world.track.total) | 0) + ' m', big: false }
        ];
      }
    },
    chase: {
      id: 'chase', name: 'Persecución', blurb: 'Eres la patrulla: intercepta a los 4 fugados',
      info: '130 s · 4 fugados · eres la patrulla · detención por contacto',
      win: 'pegarte menos de 7 m durante 1,5 s a cada fugado',
      laps: 0, rivals: 4, aiSpeed: 0.97, strictWalls: true, live: true, timed: 130, police: true,
      setup(g) {
        g.state.catches = 0; g.state.target = 4; g.state.clock = 0;
        for (const c of g.cars) if (c.isPlayer) { c.color = '#1c2b46'; c.colorLin = G.toLinear(G.hexToRgb01('#1c2b46')); c.siren = true; }
        g.cars.forEach((c, i) => { if (!c.isPlayer) { c.siren = false; c.fugitive = true; c.caught = 0; c.color = ['#c9c9cf', '#3f7f2f', '#8c2a2a', '#d9a021'][i % 4]; c.colorLin = G.toLinear(G.hexToRgb01(c.color)); } });
      },
      update(g, dt) {
        const st = g.state;
        st.clock += dt;
        const left = st.timeLimit - st.clock;
        if (left <= 0) { g.finish(st.catches >= st.target ? '¡Todos detenidos!' : 'Escaparon: ' + st.catches + '/' + st.target); return false; }
        for (const c of g.cars) {
          if (!c.fugitive || c.caught > 0) continue;
          const p = g.player;
          const d = Math.hypot(c.pos[0] - p.pos[0], c.pos[2] - p.pos[2]);
          c.near = d < 7.5 && p.speed > 6 ? (c.near || 0) + dt : 0;
          if (c.near > 1.05) {
            c.caught = 0.001; st.catches++; st.timeLimit += 10;
            g.hud.toast('¡SOSPECHOSO DETENIDO! ' + st.catches + '/' + st.target, 2.2);
            g.sound.ok && g.sound.chord([520, 660, 784, 1046], 0.3, 0.18);
            G.Effects.sparks(g.fx, c.pos[0], c.pos[1] + 0.6, c.pos[2], 0, 0, 9);
